name: Database CI

# SUPABASE-ENV-PIPELINE-1 — proves, on every relevant change, that the
# repository migrations are the schema source of truth:
#   1. a CLEAN local Supabase stack rebuilds from supabase/migrations alone,
#   2. the seed file loads (data-only; guard-tested),
#   3. migration lint passes (RLS / policies / grants / version uniqueness),
#   4. the committed types/database.types.ts matches the schema (no drift),
#   5. the RLS / database integration suites pass against that clean stack.
#
# DB-CI-COVERAGE-GAP-1 — extends (5) to the database suites that had NO CI
# protection at all: tests/integration/billing (9 suites) and
# tests/integration/accounts (5 suites) were environment-gated and activated by
# no workflow, so they silently skipped everywhere. They now run here, on the
# same ephemeral loopback stack, behind a gate that fails closed when a group
# discovers nothing, executes nothing, or resolves entirely to skipped tests —
# because for an opt-in suite "jest exited 0" proves nothing on its own.
#
# NO cloud project is ever touched: everything runs on the loopback Docker
# stack inside the runner. There are deliberately no secrets in this workflow —
# the local stack's keys are ephemeral throwaways.
#
# PATH FILTERS: deliberately DIRECTORY-scoped (repositories/, services/, core/,
# workflow-engine/, utils/, lib/) rather than a hand-picked file list. These
# suites exercise real repositories, services, RPCs and RLS, so a new
# database-touching service must trigger this gate without anyone remembering
# to extend a list. Documentation-only changes still do not trigger it.

on:
  pull_request:
    branches: [v2-main]
    # NOTE: GitHub Actions does not support YAML anchors, so this list is
    # duplicated verbatim under `push:` below. tests/unit/pipeline/workflow-safety.test.ts
    # asserts the two lists stay identical.
    paths:
      - "supabase/**"
      - "types/database.types.ts"
      - "repositories/**"
      - "services/**"
      - "core/**"
      - "workflow-engine/**"
      - "utils/**"
      - "lib/**"
      - "middleware.ts"
      - "tests/integration/security/**"
      - "tests/integration/migrations/**"
      - "tests/integration/billing/**"
      - "tests/integration/accounts/**"
      - "tests/helpers/**"
      - "tests/globalTeardown.ts"
      - "scripts/check-migration-rls.mjs"
      - "scripts/db-types.mjs"
      - "scripts/supabase-test.mjs"
      - "scripts/db-push*.mjs"
      - "scripts/dev-*.mjs"
      - "scripts/lib/**"
      - "scripts/ci/db-suite-gate.mjs"
      - "scripts/ci/rpc-signature-guard.mjs"
      - "scripts/ci/rpc-dynamic-callers.json"
      - "scripts/ci/rpc-result-contracts.json"
      - "scripts/ci/rpc-return-compat.json"
      - "types/rpc.ts"
      - "package.json"
      - "package-lock.json"
      - "jest.config.mjs"
      - "jest.setup.ts"
      - "tsconfig.json"
      - ".github/workflows/db-ci.yml"
  push:
    branches: [v2-main, v2-dev]
    paths:
      - "supabase/**"
      - "types/database.types.ts"
      - "repositories/**"
      - "services/**"
      - "core/**"
      - "workflow-engine/**"
      - "utils/**"
      - "lib/**"
      - "middleware.ts"
      - "tests/integration/security/**"
      - "tests/integration/migrations/**"
      - "tests/integration/billing/**"
      - "tests/integration/accounts/**"
      - "tests/helpers/**"
      - "tests/globalTeardown.ts"
      - "scripts/check-migration-rls.mjs"
      - "scripts/db-types.mjs"
      - "scripts/supabase-test.mjs"
      - "scripts/db-push*.mjs"
      - "scripts/dev-*.mjs"
      - "scripts/lib/**"
      - "scripts/ci/db-suite-gate.mjs"
      - "scripts/ci/rpc-signature-guard.mjs"
      - "scripts/ci/rpc-dynamic-callers.json"
      - "scripts/ci/rpc-result-contracts.json"
      - "scripts/ci/rpc-return-compat.json"
      - "types/rpc.ts"
      - "package.json"
      - "package-lock.json"
      - "jest.config.mjs"
      - "jest.setup.ts"
      - "tsconfig.json"
      - ".github/workflows/db-ci.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to verify (defaults to the ref's head)"
        required: false
  workflow_call:
    inputs:
      sha:
        description: "Commit SHA to verify"
        required: false
        type: string

concurrency:
  group: db-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.sha || 'head' }}
  cancel-in-progress: true

jobs:
  db-ci:
    name: clean reset + lint + types + RLS/billing/account suites
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Migration lint (RLS / policies / grants / version uniqueness)
        run: npm run lint:migrations

      - name: Forward-only guard — applied migrations are never edited
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          MODIFIED=$(git diff --name-only --diff-filter=M "origin/${{ github.base_ref }}"...HEAD -- supabase/migrations || true)
          if [ -n "$MODIFIED" ]; then
            echo "ABORT — existing migration files were MODIFIED (migrations are forward-only; add a new migration instead):"
            echo "$MODIFIED"
            exit 1
          fi

      - name: Start local Supabase stack (applies all migrations + seed)
        # Same pinned CLI + loopback-only helper used locally; writes
        # .env.test.local with the stack's throwaway keys.
        run: npm run supabase:test:start

      - name: Prove clean reset-from-zero
        # `start` already applied the chain once; `db reset` drops and replays
        # every migration plus supabase/seed.sql from scratch — the actual
        # "migrations reconstruct the schema from zero" proof. Every suite group
        # below therefore runs against this SINGLE freshly-rebuilt stack.
        run: npm run supabase:test:reset

      - name: Types drift gate
        run: npm run db:types:check

      - name: RPC signature drift guard
        # RPC-SIGNATURE-DRIFT-GUARD-1 — reads the migrated LOCAL catalog
        # (pg_proc, via the stack's own database container) and proves the
        # generated types AND every static TypeScript .rpc() caller still match
        # it. Runs BEFORE the suite groups: a signature mismatch is a fast,
        # unambiguous failure, not a confusing PostgREST error 20 minutes into
        # the billing suites. Loopback-only; no connection string, no secret.
        run: node scripts/ci/rpc-signature-guard.mjs run --out-dir .

      - name: Export loopback stack environment for the database suite groups
        # Suites are opt-in and read connection values from process env with
        # precedence over .env files. Exported ONCE here (masked) so all three
        # groups share the same activated, verified-loopback environment.
        run: |
          set -euo pipefail
          while IFS='=' read -r k v; do
            case "$k" in
              NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|TOKEN_ENCRYPTION_KEY|OAUTH_STATE_SIGNING_KEY)
                echo "::add-mask::$v"
                echo "$k=$v" >> "$GITHUB_ENV"
                ;;
            esac
          done < .env.test.local
          URL=$(grep -m1 '^NEXT_PUBLIC_SUPABASE_URL=' .env.test.local | cut -d= -f2-)
          case "$URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "ABORT — expected loopback Supabase URL"; exit 1 ;;
          esac
          echo "ALLOW_DB_INTEGRATION_TESTS=true" >> "$GITHUB_ENV"

      - name: Activation preflight — fail closed if a gate variable is absent or the DB is not loopback
        # Without this, a missing ALLOW_DB_INTEGRATION_TESTS turns every suite
        # below into describe.skip and the job still goes green.
        run: node scripts/ci/db-suite-gate.mjs preflight

      # The three groups run SEQUENTIALLY against the one stack. They share a
      # single database and several assert population-wide invariants, so each
      # group runs --runInBand and the RLS group (which owns those invariants)
      # goes first, on the untouched post-reset state. Each suite owns its
      # fixtures (createFixtureTracker / cleanupFixtures) and tests/globalTeardown
      # sweeps any escaped @chainreact.test row after every group, so no reset is
      # needed between groups.
      - name: RLS / migration database suites (group 1/3)
        run: node scripts/ci/db-suite-gate.mjs run --group security --min-suites 40 --out db-suite-result-security.json

      - name: Billing database suites (group 2/3)
        # Upgrade/downgrade atomicity + idempotency, entitlement transitions,
        # AI-credit gating, reserve/reconcile — against the REAL RPCs.
        run: node scripts/ci/db-suite-gate.mjs run --group billing --min-suites 9 --out db-suite-result-billing.json

      - name: Account database suites (group 3/3)
        # Purge / cascade / no-orphan, deletion authorization atomicity,
        # membership cleanup, ledger anonymization — against the REAL schema.
        run: node scripts/ci/db-suite-gate.mjs run --group accounts --min-suites 5 --out db-suite-result-accounts.json

      - name: Upload database suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-suite-results-${{ inputs.sha || github.sha }}
          path: db-suite-result-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local stack
        if: always()
        run: npm run supabase:test:stop
