name: Deploy development

# SUPABASE-ENV-PIPELINE-1 — the v2-dev lane.
#
# Trigger: a push to the `v2-dev` deployment-marker branch (which only ever
# receives owner-approved SHAs), or a manual dispatch naming an exact SHA.
#
# Order is enforced, database gate FIRST:
#   database-ci (clean local proof for this SHA)
#   → migrate-development (dry-run, then apply pending migrations to the DEV
#     project through the same fail-closed guards as `npm run db:push:dev`)
#   → deploy-app (Vercel deployment for the same SHA)
#   → smoke (public + authenticated-when-creds-exist against the dev app)
#   → certification artifact (exact SHA + migration head + results; consumed
#     by promote-production, which refuses any SHA without one)
#
# A failed migration or database verification BLOCKS the app deployment.
#
# Environment `development` (GitHub → Settings → Environments) holds:
#   SUPABASE_DEV_PROJECT_REF   — 20-char ref of chainreact-dev
#   SUPABASE_DEV_DB_URL        — session-pooler Postgres URL (percent-encoded)
#   SUPABASE_DEV_URL           — https://<dev-ref>.supabase.co
#   SUPABASE_DEV_SERVICE_ROLE_KEY (only if the bootstrap step is enabled)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DEV_SMOKE_EMAIL / DEV_SMOKE_PASSWORD (optional — authenticated smoke)
#   DEV_APP_URL — stable dev hostname, e.g. https://dev.chainreact.app
# Never production values. Logs print project refs and hostnames only.

on:
  push:
    branches: [v2-dev]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact commit SHA approved for development"
        required: true

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve + verify SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout (full history for SHA verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve requested SHA
        id: resolve
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.sha || github.sha }}"
          # Must be a full 40-char SHA that exists in this repository.
          if ! [[ "$REQUESTED" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ABORT — '$REQUESTED' is not a full 40-char commit SHA."
            exit 1
          fi
          if ! git cat-file -e "$REQUESTED^{commit}"; then
            echo "ABORT — commit $REQUESTED does not exist in this repository."
            exit 1
          fi
          echo "sha=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "Deploying development from $REQUESTED"

  database-ci:
    name: database CI gate
    needs: resolve
    uses: ./.github/workflows/db-ci.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}

  migrate-development:
    name: migrate development database
    needs: [resolve, database-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Verify development target identity (refs only, fail closed)
        env:
          CHAINREACT_DB_TARGET: development
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          set -euo pipefail
          node -e '
            import("./scripts/lib/env-target.mjs").then(({ resolveDbTarget }) => {
              const r = resolveDbTarget(process.env, { expectedTarget: "development" });
              if (!r.ok) { console.error("ABORT — " + r.reason); process.exit(1); }
              console.log("Development target confirmed: " + r.ref);
            });
          '

      - name: Migration dry-run, then apply (guarded db:push:dev)
        env:
          CHAINREACT_DB_TARGET: development
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: npm run db:push:dev

      - name: Verify migration history (no pending, no divergence)
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 migration list --db-url "$SUPABASE_DEV_DB_URL" | tee migration-list.txt
          # Every local migration must show a remote timestamp; a row with an
          # empty Remote column means a pending/skipped migration.
          if awk -F'|' 'NR>2 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/ { found=1 } END { exit !found }' migration-list.txt; then
            echo "ABORT — migrations remain pending on development after push."
            exit 1
          fi
          echo "migration_head=$(ls supabase/migrations | sort | tail -1 | cut -d_ -f1)" >> "$GITHUB_ENV"

      - name: Record migration head
        run: echo "Development migration head = $migration_head"

  deploy-app:
    name: deploy dev application (after DB gate)
    needs: [resolve, migrate-development]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Materialize the v2-dev branch in the runner clone
        # BRANCH ATTRIBUTION IS LOAD-BEARING (V2-DEV-BRANCH-ATTRIBUTION-1):
        # when the checkout has git metadata, the Vercel CLI derives the branch
        # from git and IGNORES VERCEL_GIT_COMMIT_REF. A detached-HEAD checkout
        # therefore produced deployments with gitBranch "HEAD", and the
        # v2-dev-scoped Preview env (Supabase trio, empty Turnstile key, app
        # URLs) never attached — the app built with the GENERIC preview env
        # instead (production values). Observed on the first three lane runs.
        # A real local branch named v2-dev at the exact SHA fixes attribution
        # at the source. Local to the runner clone; nothing is pushed.
        run: git checkout -B v2-dev ${{ needs.resolve.outputs.sha }}

      - name: Deploy to Vercel (preview lane pinned to v2-dev env)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Belt-and-braces alongside the materialized branch above.
          VERCEL_GIT_COMMIT_REF: v2-dev
          VERCEL_GIT_COMMIT_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          URL=$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" 2>vercel-err.log) || {
            cat vercel-err.log; exit 1;
          }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Verify branch attribution (fail closed — env scoping depends on it)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_URL#https://}"
          REF=$(curl -sf "https://api.vercel.com/v13/deployments/$HOST?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{console.log(JSON.parse(d).meta?.githubCommitRef ?? '(none)');})")
          echo "Deployment branch attribution: $REF"
          if [ "$REF" != "v2-dev" ]; then
            echo "ABORT — deployment is attributed to '$REF', not v2-dev. The branch-scoped"
            echo "Preview env (dev Supabase trio, Turnstile override) did NOT attach; the app"
            echo "would be built with the generic preview env. Refusing to alias or smoke it."
            exit 1
          fi

      - name: Alias stable dev hostname (when configured)
        if: ${{ vars.DEV_APP_HOSTNAME != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # REST, not `vercel alias`: the CLI's alias command insists on loading
        # the USER behind the token and 404s ("User not found") on TEAM-scoped
        # tokens — observed on both first v2-dev runs, with and without
        # --scope. The REST API accepts team tokens directly, so the alias
        # binds without widening the token's privilege. Deployment id is
        # resolved from the deploy step's URL first.
        run: |
          set -euo pipefail
          HOSTNAME_URL="${{ steps.deploy.outputs.url }}"
          DEP_HOST="${HOSTNAME_URL#https://}"
          DEP_ID=$(curl -sf "https://api.vercel.com/v13/deployments/$DEP_HOST?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);if(!j.id){console.error('no deployment id');process.exit(1);}console.log(j.id);})")
          echo "Aliasing deployment $DEP_ID -> ${{ vars.DEV_APP_HOSTNAME }}"
          RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.vercel.com/v2/deployments/$DEP_ID/aliases?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"alias\":\"${{ vars.DEV_APP_HOSTNAME }}\"}")
          if [ "$RESP" != "200" ] && [ "$RESP" != "201" ]; then
            echo "ABORT — alias API returned HTTP $RESP"
            exit 1
          fi
          echo "Alias bound (HTTP $RESP)."

  smoke:
    name: development smoke
    needs: [resolve, deploy-app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install (npm ci + browsers)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Protection-bypass gate + readiness probe (fail closed)
        env:
          # The dev Preview lane keeps Vercel Authentication ENABLED; automated
          # access uses the supported Protection Bypass for Automation secret,
          # stored ONLY in the GitHub `development` environment. GitHub masks
          # the value in logs; it is passed by env, never echoed.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE_BASE: ${{ vars.DEV_APP_HOSTNAME != '' && format('https://{0}', vars.DEV_APP_HOSTNAME) || needs.deploy-app.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "ABORT — VERCEL_AUTOMATION_BYPASS_SECRET is not configured in the development environment."
            echo "The Preview deployment is protected by Vercel Authentication (by design); smoke cannot"
            echo "reach it without the Protection Bypass for Automation secret. Refusing to run a smoke"
            echo "that would only prove a 401."
            exit 1
          fi
          # Readiness: alias/TLS/DNS can lag the first deployment. Probe with
          # the bypass header until the app answers 200, then hand Playwright a
          # ready origin. 401/403 here means the bypass is wrong — fail closed.
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --max-time 15 "$SMOKE_BASE/auth/sign-in" || echo 000)
            if [ "$CODE" = "200" ]; then echo "Ready ($SMOKE_BASE answered 200)."; exit 0; fi
            echo "not ready yet (HTTP $CODE) — attempt $i/24"
            sleep 5
          done
          echo "ABORT — $SMOKE_BASE never answered 200 with the bypass header (last HTTP $CODE)."
          echo "401/403 = bypass secret rejected; 000/404 = DNS, TLS, or alias not ready."
          exit 1

      - name: Smoke against the dev deployment
        env:
          PRODUCTION_SMOKE_BASE_URL: ${{ vars.DEV_APP_HOSTNAME != '' && format('https://{0}', vars.DEV_APP_HOSTNAME) || needs.deploy-app.outputs.url }}
          PRODUCTION_SMOKE_EMAIL: ${{ secrets.DEV_SMOKE_EMAIL }}
          PRODUCTION_SMOKE_PASSWORD: ${{ secrets.DEV_SMOKE_PASSWORD }}
          # Read by tests/smoke/helpers/env.ts → Playwright context headers.
          # The smoke config also forces traces OFF when this is set, so the
          # value can never appear in trace/report artifacts.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke:prod

  certify:
    name: development certification artifact
    needs: [resolve, migrate-development, deploy-app, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write certification (sanitized — no secrets)
        run: |
          set -euo pipefail
          cat > dev-certification.json << EOF
          {
            "sha": "${{ needs.resolve.outputs.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "deployment_url": "${{ needs.deploy-app.outputs.url }}",
            "database": "migrations applied + history verified",
            "smoke": "passed",
            "certified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat dev-certification.json

      - name: Upload certification
        uses: actions/upload-artifact@v4
        with:
          name: dev-certification-${{ needs.resolve.outputs.sha }}
          path: dev-certification.json
          retention-days: 90
